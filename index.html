<!DOCTYPE html>

<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

* {

  margin: 0;
  padding: 0;
  box-sizing: border-box;

}

body {

  background: #000000;

  font-family:
    'Inter',
    sans-serif;

  color: ffffff;

  min-height: 100vh;

  padding: 30px;

}

.container {

  max-width: 760px;

  margin: auto;

}

.topHeader {

  text-align: center;

  margin-bottom: 40px;

}

.logo {

  width: 120px;

  margin-bottom: 15px;

}

.brand {
  
color: white;
  
  font-size: 38px;

  font-weight: 700;

  letter-spacing: -1px;

}

.subtext {

  color: #6b7280;

  margin-top: 8px;

  font-size: 15px;

}

.searchCard {

  background: #ofofof;

  border-radius: 18px;

  padding: 25px;

  border: 1px solid #222222;

  margin-bottom: 25px;

}

input {

  background: #111111;

    Color: white;
  
  width: 100%;

  padding: 18px;

  border-radius: 12px;

  border: 1px solid #222222;

  font-size: 17px;

  margin-bottom: 18px;

}

input:focus {

  outline: none;

  border-color: #facc15;

}

button {

  width: 100%;

  padding: 18px;

  border: none;

  border-radius: 12px;

  background: white;

  color: black;

  font-size: 16px;

  font-weight: 600;

  cursor: pointer;

  transition: 0.3s;

}

button:hover {

  background: #000;

}

.result {

  display: none;

}

.section {

  background: #0f0f0f;

  border-radius: 18px;

  padding: 28px;

  border: 1px solid #222222;

  margin-bottom: 20px;

}

.label {

  font-size: 12px;

  font-weight: 600;

  letter-spacing: 1px;

  color: #888888;

  text-transform: uppercase;

  margin-bottom: 10px;

}

.value {

  font-size: 26px;

  font-weight: 700;

}

.grid {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(240px,1fr)
    );

  gap: 20px;

}

.smallValue {

  font-size: 20px;

  font-weight: 600;

}

  .value,
.smallValue {

  color: white;

}

.statusBadge {

  display: inline-block;

  padding: 12px 18px;

  border-radius: 999px;

  font-size: 15px;

  font-weight: 600;

  margin-top: 10px;

}

.designing {

  background: #ede9fe;

  color: #7c3aed;

}

.production {

  background: #fef3c7;

  color: #d97706;

}

.shipping {

  background: #dbeafe;

  color: #2563eb;

}

.delivered {

  background: #dcfce7;

  color: #16a34a;

}

.timeline {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  margin-top: 30px;

  width: 100%;

}

.timelineItem {

  flex: 1;

  display: flex;

  flex-direction: column;

  align-items: center;

  position: relative;

}

.dot {

  width: 18px;

  height: 18px;

  border-radius: 50%;

  margin-bottom: 10px;

  z-index: 2;

}

.timelineItem:not(:last-child)::after {

  content: '';

  position: absolute;

  top: 8px;

  left: 50%;

  width: 100%;

  height: 3px;

  background: #d1d5db;

  z-index: 1;

}

.done {

  background: #22c55e;

}

.current {

  background: #facc15;

}

.pending {

  background: #d1d5db;

}

.timelineText {

  font-size: 12px;

  text-align: center;

  line-height: 1.4;

}

.trackButton {

  display: inline-block;

  margin-top: 18px;

  background: #111827;

  color: white;

  text-decoration: none;

  padding: 14px 18px;

  border-radius: 12px;

  font-weight: 600;

}

.designPreviewImage {

  width: 100%;

  max-width: 650px;

  border-radius: 16px;

  box-shadow:
    0 6px 20px rgba(0,0,0,0.12);

  cursor: pointer;

  transition: all 0.3s ease;

}

.designPreviewImage:hover {

  transform: scale(1.02);

}

.designPreviewPlaceholder {

  text-align: center;

  padding: 40px;

  background: #f9fafb;

  border: 2px dashed #d1d5db;

  border-radius: 16px;

  color: #6b7280;

}

.designPreviewLabel {

  margin-top: 12px;

  font-size: 13px;

  color: #9ca3af;

}

.designPreviewSection {

  grid-column: 1 / -1;

}
.productionSection {

  grid-column: 1 / -1;

}

.footer {

  text-align: center;

  margin-top: 50px;

  color: #9ca3af;

  font-size: 14px;

}

@media screen and (max-width: 768px) {

  body {

    padding: 18px;

  }

  .brand {

    font-size: 28px;

  }

  .value {

    font-size: 22px;

  }

}

</style>

</head>

<body>

<div class="container">

<div class="topHeader">

<img
class="logo"
src="https://lh3.googleusercontent.com/d/1X2m4s7-et9jC92mFfNkYulRDv_vnsTtT">

<div class="brand">
RAI ATHLETIC WEAR
</div>

<div class="subtext">
ORDER TRACKING
</div>

</div>

<div class="searchCard">

<input
type="text"
id="orderNo"
placeholder="Enter your Order Number">

<button onclick="trackOrder()">
TRACK ORDER
</button>

</div>

<div
class="result"
id="result">

<div class="section">

<div class="label">
Order Number
</div>

<div
class="value"
id="orderText"></div>

</div>

<div class="section productionSection">

<div class="label">
Production Status
</div>

<div
class="statusBadge"
id="progressText"></div>

<div
class="timeline"
id="timeline">

</div>
</div>
</div>

<div class="grid">

<div class="section">

<div class="label">
Team Name
</div>

<div
class="smallValue"
id="teamText"></div>

</div>

<div class="section">

<div class="label">
Customer
</div>

<div
class="smallValue"
id="customerText"></div>

</div>

<div class="section">

<div class="label">
Region
</div>

<div
class="smallValue"
id="regionText"></div>

</div>

</div>

<div class="section">

<div class="label">
Last Status Update
</div>

<div
class="smallValue"
id="lastStatusUpdateText">
</div>

</div>
<div class="section designPreviewSection">

<div class="label">
Design Preview
</div>

<div id="designContainer">

<div
style="
color:#6b7280;
font-size:15px;
">

⏳ Waiting for Design Confirmation

</div>

</div>


</div>

<div class="grid">

<div class="section">

<div class="label">
Payment Status
</div>

<div
class="smallValue"
id="paymentText"></div>

</div>

<div class="section">

<div class="label">
Tracking Number
</div>

<div
class="smallValue"
id="trackingText"></div>

<a
id="trackingLink"
class="trackButton"
target="_blank">

Track Shipment

</a>

</div>

</div>

</div>

<div class="footer">

Rai Athletic Wear © 2026

</div>

</div>

<script>

window.onload = function() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const orderNo =
    params.get('orderNo');

  if (orderNo) {

    document.getElementById(
      'orderNo'
    ).value = orderNo;

    trackOrder();

  }

}


async function trackOrder() {

  const orderNo =
    document
      .getElementById('orderNo')
      .value
      .trim();

  if (!orderNo) {

    alert('Please enter order number');

    return;
  }

  try {

    const response =
      await fetch(
        'https://script.google.com/macros/s/AKfycbwqe6X_55uK7pZi8khOrx8oJoMVdP1hsteCG3G2VZGzC7HW4cK57EtKNlF7F9Xo2gRxMQ/exec?orderNo=' +
        encodeURIComponent(orderNo)
      );

    const data =
      await response.json();

    showResult(data);

  }

  catch(error) {

    alert(
      'Unable to retrieve order information'
    );

    console.error(error);

  }

}


function showResult(data) {

  if (!data.success) {

    alert(
      'Order not found'
    );

    return;

  }

  document
    .getElementById(
      'result'
    )
    .style.display =
      'block';

  document
    .getElementById(
      'orderText'
    )
    .innerHTML =
      data.orderNo;

  document
    .getElementById(
      'teamText'
    )
    .innerHTML =
      data.teamName;

  document
    .getElementById(
      'customerText'
    )
    .innerHTML =
      data.customerName;

  document
    .getElementById(
      'regionText'
    )
    .innerHTML =
      data.region;

  document
    .getElementById(
      'paymentText'
    )
    .innerHTML =
      data.payment;

  document
    .getElementById(
      'trackingText'
    )
    .innerHTML =
      data.trackingNumber;

      document
  .getElementById(
    'lastStatusUpdateText'
  )
  .innerHTML =
    data.lastStatusUpdate || '';

      const designContainer =
  document.getElementById(
    'designContainer'
  );

if (data.designImage) {

  designContainer.innerHTML =

  `
<img
class="designPreviewImage"
src="${data.designImage}"
onclick="window.open('${data.designImage}','_blank')"
>

<div class="designPreviewLabel">

Click image to enlarge

</div>

`;

}

else {

  designContainer.innerHTML =

  `
<div class="designPreviewPlaceholder">

<div style="font-size:48px;">
🎨
</div>

<div>

Waiting for Design Confirmation

</div>

<div class="designPreviewLabel">

Design will appear here once approved

</div>

</div>
`;

}

  const progressEl =

    document.getElementById(
      'progressText'
    );

  progressEl.innerHTML =
    data.progress;

  progressEl.className =
    'statusBadge';

  const status =
    data.progress
      .toLowerCase();

  if (
    status.includes(
      'design'
    )
  ) {

    progressEl.classList.add(
      'designing'
    );

  }

  else if (
    status.includes(
      'production'
    )
  ) {

    progressEl.classList.add(
      'production'
    );

  }

  else if (
    status.includes(
      'shipping'
    )
  ) {

    progressEl.classList.add(
      'shipping'
    );

  }

  else if (
    status.includes(
      'deliver'
    )
  ) {

    progressEl.classList.add(
      'delivered'
    );

  }


  const timeline =

    document.getElementById(
      'timeline'
    );

  const steps = [

    'Order Submitted',
    'Design Confirmed',
    'Production In Progress',
    'Shipping',
    'Delivered'

  ];

  let currentStep = 0;

  if (

    status.includes(
      'filling namelist'
    )

    ||

    status.includes(
      'designing'
    )

    ||

    status.includes(
      'preparing namelist'
    )

  ) {

    currentStep = 0;

  }

  else if (

    status.includes(
      'waiting test print'
    )

  ) {

    currentStep = 1;

  }

  else if (

    status.includes(
      'in production'
    )

  ) {

    currentStep = 2;

  }

  else if (

    status.includes(
      'shipping in china'
    )

    ||

    status.includes(
      'shipping'
    )

  ) {

    currentStep = 3;

  }

  else if (

    status.includes(
      'delivered'
    )

  ) {

    currentStep = 4;

  }

  timeline.innerHTML = '';

  steps.forEach(

    function(step, index) {

      let dotClass =
        'pending';

      if (
        index < currentStep
      ) {

        dotClass = 'done';

      }

      else if (
        index === currentStep
      ) {

        dotClass = 'current';

      }

      timeline.innerHTML += `

<div class="timelineItem">

<div class="dot ${dotClass}"></div>

<div class="timelineText">
${step}
</div>

</div>

`;

    }

  );


  const trackingLink =

    document.getElementById(
      'trackingLink'
    );

  trackingLink.href =

    'https://www.dhl.com/ca-en/home/tracking/tracking-express.html?submit=1&tracking-id='
    + data.trackingNumber;

}

</script>

</body>
</html>
